[package]
name = "sootmark-mlocate"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "The locate database (mlocate.db, updatedb) for forensics: every directory indexed with its modification time and the names in it, from a Linux system's last updatedb run."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/mlocate"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "linux", "locate"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "mlocate"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
